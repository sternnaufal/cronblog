# ============================================================
# cronblog - GitHub Actions Workflow
# Scheduled: 2x per week (Monday & Thursday at 08:00 UTC)
# Manual trigger also supported via workflow_dispatch
# ============================================================

name: cronblog - Automated Blogger Publisher

on:
  schedule:
    # Twice weekly: Monday & Thursday at 08:00 UTC
    - cron: '0 8 * * 1,4'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic (leave empty for auto-trend)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (generate only, no publish)'
        required: false
        type: boolean
        default: false

# Prevent concurrent runs (don't publish duplicate articles)
concurrency:
  group: cronblog
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cronblog/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cronblog/requirements.txt

      - name: Create .env file from secrets
        working-directory: cronblog
        run: |
          cat > .env << EOF
          # Custom API (local - skipped in CI since it's localhost)
          CUSTOM_API_BASE_URL=${{ secrets.CUSTOM_API_BASE_URL || 'http://localhost:20128/v1' }}
          CUSTOM_API_KEY=${{ secrets.CUSTOM_API_KEY || 'not-needed' }}
          CUSTOM_MODEL=${{ secrets.CUSTOM_MODEL || 'combo1' }}
          # Cloud fallbacks
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          BLOGGER_BLOG_ID=${{ secrets.BLOGGER_BLOG_ID }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          RSS_FEEDS=${{ secrets.RSS_FEEDS || 'https://news.google.com/rss,https://feeds.feedburner.com/blogspot/gJZg' }}
          MAX_ARTICLES_PER_RUN=${{ secrets.MAX_ARTICLES_PER_RUN || '1' }}
          CRON_SCHEDULE=${{ secrets.CRON_SCHEDULE || '0 8 * * 1,4' }}
          EOF
          echo "Created .env file"

      - name: Set up Google API credentials
        working-directory: cronblog
        run: |
          # Option A: token.json (from OAuth authorization - most reliable)
          echo "${{ secrets.BLOGGER_TOKEN_JSON }}" | base64 -d > token.json 2>/dev/null && \
            echo "Loaded token.json" || \
            echo "Note: BLOGGER_TOKEN_JSON not set"
          
          # Option B: client_secret.json (for interactive OAuth flow)
          echo "${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}" | base64 -d > client_secret.json 2>/dev/null && \
            echo "Loaded client_secret.json" || \
            echo "Note: BLOGGER_CLIENT_SECRET_JSON not set"
          
          # Option C: Service account JSON key
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" | base64 -d > service-account.json 2>/dev/null && \
            echo "Loaded service-account.json" || \
            echo "Note: GOOGLE_SERVICE_ACCOUNT_JSON not set"

      - name: Validate configuration
        working-directory: cronblog
        run: python -m src.main --validate

      - name: Generate and publish articles
        working-directory: cronblog
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            FLAGS="--dry-run"
          else
            FLAGS=""
          fi
          
          if [[ -n "${{ github.event.inputs.topic }}" ]]; then
            FLAGS="$FLAGS --topic \"${{ github.event.inputs.topic }}\""
          fi
          
          python -m src.main $FLAGS

      - name: Upload token.json (if modified by refresh)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blogger-token
          path: cronblog/token.json
          retention-days: 7
          overwrite: true
